/* ---- звук ---- */

/* ---- игроки ---- */
const sp0=[[3,3],[4,3],[3,4],[4,4],[5,4]],order=[sel,...[0,1,2,3,4].filter(i=>i!=sel)];

/* ---- восприятие и мозг ботов ---- */
function los(a,b){const d=hyp(a,b),n=d/.6|0;for(let k=1;k<n;k++){const t=k/n;if(wl(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t,.1))return 0}return 1}

function noiseAt(x,z,r,f){for(const p of pl){if(p.i==0||p.s=='dead')continue;const d=Math.hypot(p.x-x,p.z-z);if(d<r){p.fear=Math.min(1,p.fear+f*(1-d/r));p.al={x,z,t:T}}}}
function thinkS(p){p.mode='idle';const m=pl[mi];
for(const o of pl){if(o==p||o.s=='dead'||!sees(p,o,14))continue;if(o.i==mi){if(rev){p.mem={x:o.x,z:o.z,t:T};p.fear=Math.min(1,p.fear+.5);p.susp[mi]=2}else if(gr>.08)p.susp[mi]+=Math.min(1,gr*2.5)*.45}}
if(p.susp[mi]>1&&!p.said&&pl[mi].s!='dead'){p.said=1;say(CH[p.ch].n+': «Это он! Он заражён!»');tone(700,.4,.2,'square',300);pl.forEach(q=>{if(q!=p)q.susp[mi]+=.8});noiseAt(p.x,p.z,22,.25)}
const thr=p.susp[mi]>1?m:null;
if(p.fear>.85&&p.pn<T){p.pn=T+1.6;tone(900,.5,.2,'sawtooth',500);noiseAt(p.x,p.z,18,.2)}

if(p.fear>.6&&p.mem&&T-p.mem.t<12){p.ff=bfs(...cell(p.mem));p.mode='flee';return}
const dn=pl.filter(d=>d.s=='down'&&d.i!=mi);let t=null;
if(dn.length&&(!p.mem||T-p.mem.t>8))t=near(p,dn);else if(!p.am&&gn.length)t=near(p,gn);else if(got<3&&fz.length)t=near(p,fz);else if(got>=3)t=ex;
const nb=near(p,pl.filter(o=>o!=p&&o.s!='dead'));if(nb&&hyp(p,nb)>20&&Math.random()<.5)t=nb;
if(t){p.field=bfs(...cell(t));p.t=t;p.mode='fld'}}
function thinkM(p){p.mode='idle';const st=pl.filter(s=>s.i!=mi&&s.s=='ok');if(!st.length||mst>0)return;let v=null;
if(!rev){const iso=st.filter(s=>!pl.some(o=>o!=s&&o!=p&&o.s!='dead'&&hyp(o,s)<12));if(T>14&&iso.length)v=near(p,iso);else if(T>50)v=near(p,st);else v=fz.length?near(p,fz):ex}
else{const f=bfs(...cell(p));v=st.reduce((q,s)=>!q||f[tc(s.z)*W+tc(s.x)]<f[tc(q.z)*W+tc(q.x)]?s:q,null)}
p.field=bfs(...cell(v));p.t=v;p.mode='fld'}
function go(p,dx,dz,sp,dt){const l=Math.hypot(dx,dz);if(l<.05)return;mv(p,dx/l*sp*dt,dz/l*sp*dt);p.f=Math.atan2(dx,dz);p.mvg=1}

function act(p,sp,dt){if(p.mode=='fld'&&p.field&&hyp(p,p.t)>1.2){const n=nbr(p.field,p)||[p.t.x,p.t.z];go(p,n[0]-p.x,n[1]-p.z,sp,dt)}

/* ---- бой, скримеры ---- */
function shoot(p,a){if(p.am<=0||p.cd>0)return;p.am--;p.cd=.9;noise(.15,.5);tone(140,.2,.5,'square',40);noiseAt(p.x,p.z,25,.3);const m=pl[mi];

/* ---- управление ---- */
let J=null,Rt=null,jx=0,jy=0,jo,tapT=0;
addEventListener('touchstart',e=>{if(!run)return;for(const t of e.changedTouches){if(t.target.tagName=='BUTTON')continue;if(t.clientX<innerWidth/2&&J==null){J=t.identifier;jo=[t.clientX,t.clientY]}else if(Rt==null){Rt=[t.identifier,t.clientX];tapT=Date.now()}}});

const fb=$('fire'),tb=$('trap');const press=e=>{e.preventDefault();if(!run)return;if(mi==0)atk=1;else if(pl[0].s=='ok')shoot(pl[0],Math.atan2(-Math.sin(cyaw),-Math.cos(cyaw)))};

function fin(w){run=0;fb.style.display=tb.style.display='none';let s={};try{s=JSON.parse(localStorage.vr||'{}')}catch(e){}s.c=(s.c||0)+(w?60:15);try{localStorage.vr=JSON.stringify(s)}catch(e){}
$('ov').style.display='flex';$('ov').innerHTML='<h1 style="color:'+(w?'#4d6':'#e22')+'">'+(w?'ПОБЕДА':'ПОРАЖЕНИЕ')+'</h1><div>'+(w?'+60':'+15')+' 🩸</div><button onclick="location.reload()">Ещё раз</button><button onclick="location.href=\'lobby.html\'">В лобби</button>';noise(.8,.7);tone(w?500:60,1.2,.5,'sawtooth',w?900:20)}
function upd(dt){T+=dt;const m=pl[mi];mt-=dt;mst-=dt;tcd-=dt;gr=Math.min(1,gr+gs*dt);if(mi==0&&tch<3&&Math.random()<dt/20)tch++;
if(!rev&&gr>=.45){rev=1;gs=1/70;mk(m);flash();noise(.6,.8);tone(900,.8,.3,'sawtooth',100);say('МУТАЦИЯ! Заражённый среди вас');pl.forEach(o=>{if(o!=m){o.susp[mi]=2;o.fear=Math.max(o.fear,.6)}})}
tick-=dt;if(tick<=0){tick=.3;mf=bfs(...cell(m))}
for(const p of pl){p.cd-=dt;p.inv-=dt;p.mvg=0;p.fear=Math.max(0,p.fear-.12*dt);if(p.s!='ok')continue;const M=p.i==mi;
let sp=M?(rev?3.2+gr*2:3.5):3.6*CH[p.ch].spd;if(p.i!=0)sp*=.85;if(M&&mst>0)sp=0;
if(p.i==0){const vx=jx*Math.cos(cyaw)+jy*Math.sin(cyaw),vz=-jx*Math.sin(cyaw)+jy*Math.cos(cyaw),l=Math.hypot(vx,vz);if(l>.1&&sp>0)go(p,vx,vz,sp*Math.min(1,l),dt)}
else{p.tk-=dt;if(p.tk<=0){p.tk=.35;M?thinkM(p):thinkS(p)}if(sp>0)act(p,sp,dt)}
if(M&&p.cd<=0&&mst<=0){const v=pl.filter(s=>s.i!=mi&&s.s=='ok'&&s.inv<=0&&hyp(s,p)<1.9);if(v.length&&(p.i==0?atk:(rev||T>50||!pl.some(o=>o!=p&&o!=v[0]&&o.s=='ok'&&sees(o,p,14)))))hit(near(p,v))}}
atk=0;const sv=pl.filter(s=>s.i!=mi);
for(const o of trs.slice())for(const s of sv)if(s.s=='ok'&&hyp(s,o)<2.2){scare(o,s);break}
fz=fz.filter(o=>{o.m.rotation.y+=dt*2;if(sv.some(p=>p.s=='ok'&&hyp(p,o)<1.5)){sc.remove(o.m);got++;tone(600,.2,.25,'triangle',900);say('Предохранитель '+got+'/3');if(got>=3)say('Все предохранители! Беги к выходу');return 0}return 1});
gn=gn.filter(o=>{const p=sv.find(p=>p.s=='ok'&&hyp(p,o)<1.5);if(p){sc.remove(o.m);p.am+=CH[p.ch].am;if(p.i==0)say('Пистолет! Патронов: '+p.am);return 0}return 1});
for(const d of sv)if(d.s=='down'){for(const s of sv)if(s!=d&&s.s=='ok'&&hyp(s,d)<2){d.rv+=dt*CH[s.ch].rv;if(s.i==0||d.i==0)say('Поднимаем... '+Math.min(100,d.rv/3*100|0)+'%')}if(d.rv>=3){d.s='ok';d.inv=2;d.rv=0;say('Поднят!')}}
if(got>=3&&sv.some(p=>p.s=='ok'&&hyp(p,ex)<2.6))return fin(mi!=0);
if(!sv.some(p=>p.s=='ok'))return fin(mi==0)}
function draw(t){
for(const p of pl){const G=p.g;G.position.set(p.x,0,p.z);if(p.s=='ok'){G.rotation.set(0,p.f,0);G.position.y=0}else{G.rotation.set(-1.5,p.f,0);G.position.y=.25}
if(p.i==mi)rev?monGrow(G,gr):humanGrow(G,gr*2);
G.arms.forEach(([a,ph,z])=>{a.rotation.x=Math.sin(t*9+ph)*(p.mvg?.7:.08);a.rotation.z=z+(p.i==mi&&rev?Math.sin(t*2+ph)*.15:0)})}
const q=pl[0].s=='dead'?pl[spi]:pl[0],sx=Math.sin(cyaw),sz=Math.cos(cyaw);let d=5;for(let k=.5;k<=5;k+=.4)if(wl(q.x+sx*k,q.z+sz*k,.3)){d=Math.max(1.4,k-.5);break}
cam.position.set(q.x+sx*d,2.6+(5-d)*.15,q.z+sz*d);cam.lookAt(q.x,1.5,q.z);
fl.position.copy(cam.position);fl.target.position.set(q.x-sx*10,1,q.z-sz*10);pl0.position.set(q.x,2.2,q.z);
const m=pl[mi];if(rev){rl.intensity=.9+Math.sin(t*12)*.2;rl.position.set(m.x,2,m.z)}else rl.intensity=0;
trs.forEach(o=>o.m.visible=mi==0);const p0=pl[0];
$('hud').innerHTML=(p0.s=='dead'?'👁 Наблюдаешь (тап справа — следующий)':'❤️'.repeat(Math.max(0,p0.hp)))+' ⚡'+got+'/3'+(mi!=0?' 🔫'+p0.am:' ☣ ТЫ ЗАРАЖЁН 👻×'+tch)+(mt>0?'<br><small>'+msg+'</small>':'')+(p0.s=='down'?'<br>Ты упал! Ждёшь помощи...':'');
if(AC&&run){if(!draw.hb||t>draw.hb){const dd=hyp(p0,m);draw.hb=t+Math.max(.4,Math.min(1.3,dd/25));if(rev&&dd<30){tone(55,.16,.7,'sine',35);setTimeout(()=>tone(50,.14,.5,'sine',30),160)}}if(Math.random()<.004)tone(700+Math.random()*500,1.5,.03,'sine',200)}}
let t0=performance.now();
function lp(n){requestAnimationFrame(lp);const dt=Math.min(.05,(n-t0)/1000);t0=n;if(run)upd(dt);draw(n/1000);rd.render(sc,cam)}
const role=mi==0?'<h2 style="color:#e22">ТЫ ЗАРАЖЁН!</h2><div>Сначала у тебя растёт одна рука, прячь её. ⚔ бьёт того, кто рядом. Убьёшь — мгновенно мутируешь, дальше растёшь быстро. Не убьёшь — тоже мутируешь, но медленнее.<br>👻 ставит скример: выжившие бегут на него и пугаются.</div>':'<h2>Ты — '+CH[sel].n+'</h2><div>Один из пяти заражён, и ты не знаешь кто. Следи, у кого странно растёт рука.<br>Найди 3 ⚡ предохранителя, пистолет и беги к выходу. Упавших поднимают, после 3 падений — смерть.</div>';
$('ov').innerHTML='<h1 style="color:#c22;letter-spacing:6px">VEINROT</h1>'+role+'<small>Левая половина — идти, правая — крутить камеру</small><button style="font-size:22px" onclick="au();$(\'ov\').style.display=\'none\';fb.style.display=\'block\';fb.textContent=mi==0?\'⚔\':\'🔫\';if(mi==0)tb.style.display=\'block\';run=1">▶ В ТЕМНОТУ</button>';
requestAnimationFrame(lp);
</script></body></html>
