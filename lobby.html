<!DOCTYPE html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<title>VEINROT</title><style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden;touch-action:none;font-family:sans-serif;color:#e9a;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0}
.p{position:fixed;left:0;right:0;text-align:center;pointer-events:none}
.p button,.p b,.p small,.p div{pointer-events:auto}
#top{top:calc(8px + env(safe-area-inset-top))}#bot{bottom:calc(14px + env(safe-area-inset-bottom))}
button{background:#2a0a0a;color:#fcc;border:1px solid #a22;padding:10px 14px;font-size:15px;border-radius:8px;margin:3px}
button.on{background:#a22;color:#fff}
h2{margin:4px 0;color:#e33;text-shadow:0 0 10px #a00;letter-spacing:5px}
small{color:#c9a;text-shadow:0 0 4px #000}
#mm{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
</style></head><body>
<div class=p id=top></div><div class=p id=bot></div><div id=mm></div>
<script>
const TW=window.Telegram&&Telegram.WebApp;if(TW){try{TW.ready();TW.expand()}catch(e){}}
let S={c:0,u:[0],m:[0]};try{S=Object.assign(S,JSON.parse(localStorage.vr||'{}'))}catch(e){}
const sv=()=>{try{localStorage.vr=JSON.stringify(S)}catch(e){}};
const CH=[
{n:'Макс',d:'Быстрый: скорость +18%',c:0x3a8fe8,h:'cap',p:0},
{n:'Лина',d:'Охотница: 7 патронов',c:0xf0a030,h:'long',p:60},
{n:'Док',d:'Крепкий: 3 жизни',c:0x3ab060,h:'coat',p:100},
{n:'Тим',d:'Яркий фонарь +35%',c:0xe8d84a,h:'lamp',p:140},
{n:'Рита',d:'Выстрел сбивает 2 мутации',c:0xb050e0,h:'bun',p:200}];
const ST=['Свежезаражённый. Выглядит почти как человек, но ведёт себя странно.','Руки вытягиваются, кожа темнеет.','Из рёбер лезут новые конечности.','Горбится, растут зубы и шипы вдоль спины.','Убил — и вытянулся в высокого длинного монстра. Охотится.'];
/* ---- 3D ---- */
const sc=new THREE.Scene();sc.background=new THREE.Color(0x050507);sc.fog=new THREE.Fog(0x050507,7,20);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,60);
const rd=new THREE.WebGLRenderer({antialias:false});rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.setSize(innerWidth,innerHeight);document.body.prepend(rd.domElement);
addEventListener('resize',()=>{rd.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const bx=(w,h,d,c,x,y,z,p,e)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c,emissive:e||0}));m.position.set(x,y,z);p.add(m);return m};
const limb=(p,x,y,z,len,w,c,rz,hc)=>{const g=new THREE.Group();g.position.set(x,y,z);g.rotation.z=rz||0;bx(w,len,w,c,0,-len/2,0,g);if(hc!=null)bx(w*1.1,.18,w*1.1,hc,0,-len,0,g);p.add(g);return g};
sc.add(new THREE.AmbientLight(0x303045));
const torch=new THREE.PointLight(0xff8833,1.3,14);torch.position.set(2.6,2.6,2.6);sc.add(torch);
const red=new THREE.PointLight(0xff1111,.9,12);red.position.set(-3,1.6,-2);sc.add(red);
bx(.15,.8,.15,0x4a2a10,2.6,.4,2.6,sc);bx(.28,.28,.28,0xffaa33,2.6,.95,2.6,sc,0xffaa33);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshLambertMaterial({color:0x0c0c10}));fl.rotation.x=-Math.PI/2;fl.position.y=-.2;sc.add(fl);
bx(2.8,.2,2.8,0x5a3a20,0,-.1,0,sc);bx(2.8,.08,2.8,0x1f4a1a,0,.04,0,sc);
for(let i=0;i<45;i++){const a=Math.random()*6.28,r=4.5+Math.random()*9,h=.3+Math.random()*1.3;bx(.5+Math.random()*.6,h,.5+Math.random()*.6,[0x1b1b22,0x22222b,0x2a1a1a][i%3],Math.cos(a)*r,h/2-.2,Math.sin(a)*r,sc)}
const N=110,pg=new THREE.BufferGeometry(),pa=new Float32Array(N*3);for(let i=0;i<N*3;i++)pa[i]=(Math.random()-.5)*12;pg.setAttribute('position',new THREE.BufferAttribute(pa,3));sc.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xff6622,size:.07})));
function human(c){const G=new THREE.Group(),sk=0xe8b890;G.arms=[];
bx(.28,.8,.28,0x334455,-.15,.4,0,G);bx(.28,.8,.28,0x334455,.15,.4,0,G);
bx(.6,.8,.35,c.c,0,1.2,0,G);bx(.5,.5,.5,sk,0,1.85,0,G);
bx(.08,.08,.02,0x111111,-.12,1.88,.26,G);bx(.08,.08,.02,0x111111,.12,1.88,.26,G);
G.arms.push([limb(G,-.4,1.58,0,.75,.2,c.c,0,sk),0,0],[limb(G,.4,1.58,0,.75,.2,c.c,0,sk),3,0]);
const h=c.h;
if(h=='cap'){bx(.56,.14,.56,c.c,0,2.15,0,G);bx(.4,.05,.3,c.c,0,2.1,.38,G)}
if(h=='long'){bx(.56,.15,.56,0x5a3418,0,2.15,0,G);bx(.56,.7,.12,0x5a3418,0,1.85,-.28,G)}
if(h=='coat')bx(.66,.55,.4,0xeeeeee,0,1.05,0,G);
if(h=='lamp'){bx(.56,.1,.56,0x333333,0,2.14,0,G);bx(.2,.14,.1,0xffffaa,0,2.14,.3,G,0xffffaa)}
if(h=='bun'){bx(.56,.14,.56,0x222222,0,2.15,0,G);bx(.22,.22,.22,0x222222,0,2.35,-.1,G)}
return G}
function mon(st){const G=new THREE.Group(),sk=[0x7aa06a,0x6a9a5a,0x58884a,0x486a3a,0x3a4a30][st],ll=.8+st*.3,al=.8+st*.55,bh=.8+st*.12,by=ll+bh/2,hy=ll+bh+.3;G.arms=[];
bx(.35,ll,.3,0x2a2a35,-.17,ll/2,0,G);bx(.35,ll,.3,0x2a2a35,.17,ll/2,0,G);
bx(.6,bh,.35,0x3a3a3a,0,by,0,G);bx(.4,bh*.5,.05,sk,0,by,.19,G);
bx(.5,.5+st*.08,.5,sk,0,hy+st*.04,0,G);
bx(.1,.08,.03,0xff0000,-.13,hy+.05,.26,G,0xff0000);bx(.1,.08,.03,0xff0000,.13,hy+.05,.26,G,0xff0000);
if(st>=3){bx(.34,.06,.05,0x300000,0,hy-.12,.26,G);bx(.04,.1,.04,0xffffff,-.1,hy-.08,.27,G);bx(.04,.1,.04,0xffffff,.1,hy-.08,.27,G);for(let k=0;k<4;k++)bx(.1,.25,.1,0x221111,0,by-bh*.3+k*bh*.22,-.25,G)}
const arm=(x,y,z,rz,len,ph)=>G.arms.push([limb(G,x,y,z,len,.16,sk,rz,0x220000),ph,rz]);
arm(-.42,ll+bh-.1,0,0,al,0);arm(.42,ll+bh-.1,0,0,al,3);
if(st>=2){arm(-.3,by,.1,-.8,al*.8,1);arm(.3,by,.1,.8,al*.8,4)}
if(st>=4){arm(-.25,by+.2,-.2,-2.2,al*.9,2);arm(.25,by+.2,-.2,2.2,al*.9,5)}
return G}
/* ---- состояние ---- */
let cur,tab='h',idx=0,sel=0,stg=0,rot=.4,auto=0,at=0,drag=0,lx=0;
const $=i=>document.getElementById(i);
function show(){if(cur)sc.remove(cur);cur=tab=='h'?human(CH[idx]):mon(stg);cur.rotation.y=rot;sc.add(cur);const s=tab=='h'?0:stg;cam.position.set(0,1.5+s*.25,4.4+s);cam.lookAt(0,1.1+s*.25,0);ui()}
function ui(){const c=CH[idx],un=S.u.includes(idx);
$('top').innerHTML='<h2>VEINROT</h2><div><button class="'+(tab=='h'?'on':'')+'" onclick="tb(\'h\')">👥 ВЫЖИВШИЕ</button><button class="'+(tab=='m'?'on':'')+'" onclick="tb(\'m\')">☣ ЗАРАЖЁННЫЙ</button></div><small>🩸 '+S.c+'</small>';
$('bot').innerHTML=tab=='h'?
'<div><button onclick="nx(-1)">◀</button><b style="font-size:22px;color:#fff">'+c.n+(un?'':' 🔒')+'</b><button onclick="nx(1)">▶</button></div><small>'+c.d+'</small><br>'+(un?'<button class=on style="font-size:20px;padding:12px 30px" onclick="mm()">▶ ИГРАТЬ</button>':'<button class=on onclick="buy()">Купить за '+c.p+' 🩸</button>')+'<br><small>Крути персонажа пальцем</small>':
'<div>'+[0,1,2,3,4].map(i=>'<button class="'+(i==stg?'on':'')+'" onclick="sg('+i+')">'+(i+1)+'</button>').join('')+'</div><small>Стадия мутации '+(stg+1)+'/5<br>'+ST[stg]+'</small><br><button onclick="auto=!auto;ui()">'+(auto?'⏸ Стоп':'▶ Показать превращение')+'</button>'}
const tb=t=>{tab=t;auto=0;show()},nx=d=>{idx=(idx+5+d)%5;if(S.u.includes(idx))sel=idx;show()},sg=i=>{stg=i;auto=0;show()};
function buy(){const c=CH[idx];if(S.c<c.p){alert('Не хватает 🩸 (у тебя '+S.c+')');return}S.c-=c.p;S.u.push(idx);sel=idx;sv();show()}
/* ---- подбор игроков ---- */
let mt0,mi;
function mm(){$('mm').style.display='flex';$('mm').innerHTML='<h2>РЕЖИМ ИГРЫ</h2><button disabled style="opacity:.5">🌐 Онлайн (скоро: нужен сервер)</button><button class=on style="font-size:20px" onclick="try{localStorage.vrsel=sel}catch(e){};location.href=\'game.html\'">🤖 Игра с ботами</button><button onclick="mc()">Назад</button>'}
function mc(){clearInterval(mi);$('mm').style.display='none'}
function mu(){let t=(Date.now()-mt0)/1000;const full=t>=90||t<0,f=s=>Math.floor(s/60)+':'+('0'+Math.floor(s%60)).slice(-2);
const bots=CH.filter((_,i)=>i!=sel).map(c=>'🤖 Бот '+c.n);
$('mm').innerHTML='<h2>'+(full?'МАТЧ ГОТОВ':'ПОИСК ИГРОКОВ')+'</h2><div>✅ Ты ('+CH[sel].n+')</div>'+bots.map(b=>'<div>'+(full?b:'⏳ ожидание...')+'</div>').join('')+
(full?'<small>5 игроков. Один из вас случайно заражён...<br>Сама 3D-игра — следующий шаг, пока доступен 2D-прототип.</small><button class=on onclick="location.href=\'veinrot.html\'">▶ Запустить прототип</button>':'<small>Ждём людей до '+f(90)+'. Если никто не зайдёт, играешь с ботами.<br>'+f(t)+'</small><button onclick="mt0=-1e12;mu()">Играть с ботами сейчас</button>')+'<button onclick="mc()">Отмена</button>';if(full)clearInterval(mi)}
/* ---- управление и цикл ---- */
rd.domElement.addEventListener('pointerdown',e=>{drag=1;lx=e.clientX});addEventListener('pointerup',()=>drag=0);
addEventListener('pointermove',e=>{if(drag){rot+=(e.clientX-lx)*.012;lx=e.clientX}});
let t0=performance.now();
function lp(n){requestAnimationFrame(lp);const dt=Math.min(.05,(n-t0)/1000),t=n/1000;t0=n;if(!drag)rot+=dt*.5;cur.rotation.y=rot;
cur.arms.forEach(([a,p,z])=>{a.rotation.x=Math.sin(t*2+p)*.25;a.rotation.z=z+Math.sin(t*1.5+p)*.1});
torch.intensity=1.1+Math.sin(t*20)*.15+Math.random()*.2;
for(let i=0;i<N;i++){pa[i*3+1]+=dt*.3;if(pa[i*3+1]>5)pa[i*3+1]=-.2}pg.attributes.position.needsUpdate=true;
at+=dt;if(auto&&at>1.6){at=0;stg=(stg+1)%5;show()}rd.render(sc,cam)}
show();requestAnimationFrame(lp);
</script></body></html>
